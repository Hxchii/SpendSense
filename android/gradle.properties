# Sized for a 16GB machine that is also running VS Code, Chrome/Edge and the
# Dart analyzer. Gradle, the Kotlin compiler and the Android resource tools
# each run in their OWN JVM, so the real cost is the sum of these — an
# oversized Gradle heap alone starved the others and crashed the daemon with
# a native (not heap) allocation failure.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m
# Fewer concurrent workers means fewer simultaneous JVMs competing for RAM.
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
# The project lives on D:\ while Flutter's package cache lives on C:\ —
# Kotlin's incremental compiler tries to relativize paths between the two
# for its build cache and Windows can't compute a relative path across
# drive letters, which crashes the compile daemon. Non-incremental Kotlin
# compilation sidesteps it (slower per-build, but avoids the crash).
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
